name: Validate E*NKI portrait

on:
  workflow_dispatch:
  push:
    paths:
      - "avatar/**"
      - "public/avatar2d/**"
      - "scripts/validate-avatar2d.mjs"
      - ".github/workflows/build-avatar.yml"

permissions:
  contents: read

jobs:
  portrait:
    name: Validate 2.5D assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate aligned portrait set
        run: node scripts/validate-avatar2d.mjs
